name: Discogs - precio por condicion

# Lee data/price-query.txt (un release_id por linea) y devuelve el precio
# sugerido por condicion (VG+, NM, Mint...). Usa el endpoint autenticado
# price_suggestions. Se dispara al cambiar ese archivo. NO imprime el token.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'data/price-query.txt'

permissions:
  contents: write

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar precios por condicion
        env:
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          set +x
          TOKEN="${DISCOGS_USER_TOKEN:-$DISCOGS_TOKEN}"
          UA="JuanDeals/1.0 +price"
          OUT=data/price-result.txt
          if [ -z "$TOKEN" ]; then echo "No hay token"; exit 1; fi
          if [ ! -f data/price-query.txt ]; then echo "No hay lista"; exit 0; fi
          echo "Resultado precio por condicion - $(date -u +%FT%TZ)" > "$OUT"
          while IFS= read -r line || [ -n "$line" ]; do
            id=$(echo "$line" | sed 's/#.*//' | tr -cd '0-9')
            [ -z "$id" ] && continue
            {
              echo "==================================================="
              echo "RELEASE $id"
              curl -sS -A "$UA" -H "Authorization: Discogs token=$TOKEN" "https://api.discogs.com/releases/$id" -o rel.json
              jq -r '"  \(.artists_sort) - \(.title) (\(.year), \(.country))  [\((.labels//[])|map(.catno)|join(","))]"' rel.json
              echo "  --- Precio sugerido por condicion (EUR) ---"
              scode=$(curl -sS -A "$UA" -H "Authorization: Discogs token=$TOKEN" -o sug.json -w "%{http_code}" "https://api.discogs.com/marketplace/price_suggestions/$id")
              echo "  [http $scode] raw: $(head -c 300 sug.json)"
              jq -r '
                to_entries
                | map({k: .key, v: (.value.value // 0), c: (.value.currency // "")})
                | sort_by(.v)
                | .[] | "  \(.k): \(.v|.*100|round/100) \(.c)"' sug.json 2>/dev/null \
                || echo "  (jq no pudo parsear)"
              echo "  --- Mercado ahora ---"
              curl -sS -A "$UA" -H "Authorization: Discogs token=$TOKEN" "https://api.discogs.com/marketplace/stats/$id?curr_abbr=EUR" -o st.json
              jq -r '"  a la venta: \(.num_for_sale)  | mas barato (cualquier condicion): \(.lowest_price.value // "n/a") EUR"' st.json
            } >> "$OUT"
            sleep 1.2
          done < data/price-query.txt
          # Mostrar en log tambien
          cat "$OUT"
          # Commitear el resultado (no retriggerea: este wf solo escucha price-query.txt)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$OUT"
          git commit -m "Precio por condicion (resultado) [skip ci]" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "push fallo"
