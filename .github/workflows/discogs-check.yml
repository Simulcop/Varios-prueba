name: Discogs - verificar token

# Comprueba que el token de Discogs sirve y de que cuenta es.
# NO imprime el token (GitHub lo enmascara y usamos set +x). Solo el usuario.

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/discogs-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar identidad Discogs
        env:
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          set +x
          TOKEN="${DISCOGS_USER_TOKEN:-$DISCOGS_TOKEN}"
          WHICH=$( [ -n "$DISCOGS_USER_TOKEN" ] && echo "DISCOGS_USER_TOKEN" || echo "DISCOGS_TOKEN" )
          if [ -z "$TOKEN" ]; then echo "No hay ningun token configurado"; exit 0; fi
          echo "Secreto usado: $WHICH"
          CODE=$(curl -sS -o resp.json -w "%{http_code}" -A "JuanDeals/1.0 +verify" -H "Authorization: Discogs token=$TOKEN" "https://api.discogs.com/oauth/identity")
          echo "HTTP: $CODE"
          USER=$(jq -r '.username // empty' resp.json)
          if [ -n "$USER" ]; then
            echo "RESULTADO: OK - el token sirve y es de la cuenta: $USER (id $(jq -r '.id' resp.json))"
            echo "Puede escribir en la coleccion de: $USER"
          else
            echo "RESULTADO: El token NO identifica una cuenta (quiza es de catalogo, no personal)."
            echo "Mensaje de Discogs: $(jq -r '.message // "sin mensaje"' resp.json)"
          fi
