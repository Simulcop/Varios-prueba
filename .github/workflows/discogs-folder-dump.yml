name: Discogs - dump de carpetas (diagnostico)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'data/folder-dump-trigger.txt'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump carpetas
        env:
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          set +x
          TOKEN="${DISCOGS_USER_TOKEN:-$DISCOGS_TOKEN}"
          USER="juanDanielCaro"
          UA="JuanDeals/1.0 +dump"
          AUTH="Authorization: Discogs token=$TOKEN"
          OUT=data/folder-dump.txt
          if [ -z "$TOKEN" ]; then echo "No hay token"; exit 1; fi
          echo "Dump $(date -u +%FT%TZ)" > "$OUT"
          for pair in "9636592:Audiofilos" "9638958:Audiofilos Jazz" "9641811:Audiofilos Electronica"; do
            fid="${pair%%:*}"; fname="${pair#*:}"
            echo "=== CARPETA $fid ($fname) ===" >> "$OUT"
            pages=1; page=1
            while [ "$page" -le "$pages" ]; do
              curl -sS -A "$UA" -H "$AUTH" "https://api.discogs.com/users/$USER/collection/folders/$fid/releases?per_page=100&page=$page&sort=added" -o f.json
              pages=$(jq -r '.pagination.pages // 1' f.json)
              jq -r '.releases[]? | "   \(.id)\t\(([.basic_information.artists[]?.name] | join(", ")))\t\(.basic_information.title)\t\(.basic_information.year)"' f.json >> "$OUT"
              page=$((page+1)); sleep 0.6
            done
            echo "" >> "$OUT"
          done
          cat "$OUT"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$OUT"
          git commit -m "Dump carpetas [skip ci]" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "push fallo"
